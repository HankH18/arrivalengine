  # =========================================================================
  # AXIS C — GUARDS ON THE SUBJECT-MATTER TEST ITSELF (T-069 sibling sweep)
  # -------------------------------------------------------------------------
  # The rule that lets "their children's-media studio" through is the same rule
  # that would let "their daughter's company" through, and the rule that lets
  # "to track court records" through is the same one that would let "tracked
  # their court records" through. Every mechanism that neutralises a cue is a
  # mechanism somebody can widen later, and a widening that opens an R11 leak
  # must break a test rather than a member's trust.
  #
  # These six sentences were measured LEAKING against the first version of that
  # mechanism, in a sweep written after the fix and aimed at it. They are here
  # so the next person to add a head noun or a verb finds out immediately.
  # =========================================================================

  - id: axis-guard-daughters-company
