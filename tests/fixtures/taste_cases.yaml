  # =========================================================================
  # AXIS A — SUBJECT MATTER (added for T-070/F5, provenance: same_author_as_filter)
  # -------------------------------------------------------------------------
  # Every decoy in the eighty-two cases above is LEXICAL: a forbidden word
  # dropped into an otherwise neutral sentence, where the sentence is still
  # about the member. Not one case asked the other question R11 raises for
  # this roster. SPEC Q4 says the ten are INVESTORS AND WRITERS, and R11's six
  # nouns -- health, family, legal, property, money, politics -- are the
  # markets they invest in and the beats they write about. So a forbidden word
  # appears in their professional vocabulary constantly, in a grammatically
  # different job: not predicated of the member, but naming the subject matter
  # of their work.
  #
  # R11 forbids displaying "health/medical information" ABOUT A MEMBER. It does
  # not forbid saying that a member builds imaging hardware. Every case below
  # is a keep for that reason and for no other, and the reason is R11's own
  # wording, not anything src/arrival/taste.py happens to do.
  #
  # These sentences WERE red against the filter when they were written: all
  # twelve were excluded, ten of them deterministically, which is the class no
  # classifier can reopen. That is the point of adding them.
  # =========================================================================

  - id: axis-keep-cancer-imaging-startup
