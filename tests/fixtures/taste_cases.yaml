# approved_by: PENDING OWNER REVIEW — drafted 2026-09-03 by the T-4 lane
#
# ============================================================================
# THE TASTE CORPUS  --  T-4's own fixture, and the human-approval artifact
# ============================================================================
#
# ON THE FIRST LINE. T-4's acceptance criterion asks for `# approved_by: <name>
# <date>`. The implementing agent cannot approve its own answer key -- a corpus signed
# by the author of the filter it grades is not a review -- so the line records the true
# state instead of inventing a signature. The owner replaces everything after the colon
# with their name and the date once they have read the rulings below. Every case carries
# a `rationale` because that is the field a human actually reads.
#
# WHAT THE OWNER IS ACTUALLY SIGNING. 104 cases, in three provenance classes: 50
# independent judgments, 32 derived from the implementation's marker list, and 22
# written by the lane that repaired the filter. Only the first 50 are independent
# judgments; the `provenance` field on every other case says so, so that a signature
# on this file cannot be read as approval of 104 of them.
#
# HOW THESE SENTENCES WERE WRITTEN, AND WHY IT MATTERS. This corpus is NOT the grader.
# The graded corpus is the orchestrator-owned frozen one, which this lane cannot write.
# These fifty sentences were authored by an agent that was forbidden to read the frozen
# corpus, forbidden to read the previous draft of this file, and given only the six
# category definitions and the two principles below. That independence is the whole
# point: an earlier draft of this file reproduced the frozen corpus almost case for case
# (55 of 56 ids identical, two sentences verbatim), and a fixture that paraphrases the
# answer key proves only that the answer key was copied. Run against genuinely unseen
# sentences, this corpus found SIX wrong rulings in the filter, all six now fixed in
# `src/arrival/taste.py`. Five were leaks -- something R11 protects, kept:
#
#   * "the converted grain silo they live in"               was KEPT  (home)
#   * "they married an architect in June"                   was KEPT  (family)
#   * "three weeks in inpatient treatment"                  was KEPT  (health)
#   * "the years they spent suing their former co-founder"  was KEPT  (legal)
#   * "the farmhouse they purchased"                        was KEPT  (home)
#
# and one was the opposite failure, a professional fact destroyed:
#
#   * "they earned a master's in materials science"  was EXCLUDED as personal wealth,
#     by a bare `they earned`. See cover-wealth-bonus-figure for the money case that
#     must still be lost, sitting beside it on purpose.
#
# The final block of cases, marked REGRESSION COVERAGE, was added afterwards for a
# second measured hole: deleting an R11 marker outright broke nothing. Those cases
# are ordinary rulings, but each is the only case standing on a named marker.
#
# ---------------------------------------------------------------------------
# HOW TO READ A CASE
# ---------------------------------------------------------------------------
#   id           Stable handle. Never renumber.
#   text         The fact sentence as an extractor would emit it (one sentence,
#                <= 200 chars, matching contracts.Fact.text).
#   category     What the sentence is ABOUT: one of the six R11 categories, `keep`
#                for a professional fact the digest exists to surface, or
#                `unresolved` on a fail-closed case. `unresolved` was added because
#                the five fail-closed cases previously carried an R11 category that
#                their own sentences do not support -- and one of them says in its
#                rationale that inferring a category from a refusal is the invention
#                the rule forbids, while its category field did exactly that. Those
#                five now assert nothing, and the composition test no longer counts
#                them toward "the corpus spans all six R11 categories".
#   provenance   HOW THE CASE WAS WRITTEN, and the only field here that is about the
#                corpus rather than about the sentence. Three values:
#                  (absent)  one of the fifty independently authored cases -- written
#                            by an agent forbidden to read the frozen corpus, the
#                            previous draft, or the implementation.
#                  derived_from_implementation
#                            written from `src/arrival/taste.py`'s marker list. The
#                            REGRESSION COVERAGE block is all of these; each is a real
#                            ruling a reviewer can check, but none of them is an
#                            independent judgment and the owner's signature should not
#                            read as though it were.
#                  same_author_as_filter
#                            written by the lane that also wrote the filter, reasoning
#                            from SPEC R11's text and BEFORE the filter was changed --
#                            every one of them was red when it was written. Independent
#                            of the implementation, not of the author.
#   expect       `exclude` or `keep`. After apply_taste(), fact.excluded MUST equal
#                (expect == "exclude"). This is the taste judgment, and it is the field
#                the owner is being asked to approve.
#   reason       The contracts.ExclusionReason the fact must carry, or null on a keep.
#   rule_layer   `deterministic` -> apply_taste_rules() alone must reach `expect` with NO
#                LLM call. `llm` -> the rule layer must mark it unsure and hand it to the
#                classifier. This is a claim about the STAGING, not about the taste.
#   llm_returns  Only on `rule_layer: llm`. What the scripted double answers, so the test
#                is deterministic and never touches a network.
#   fail_closed  Only on the cases that prove the fail-closed rule: the classifier says
#                `unsure`, both stages are spent, and the fact is excluded anyway with
#                reason low_confidence.
#   rationale    One sentence saying why this ruling is right.
#
# ---------------------------------------------------------------------------
# THE TWO PRINCIPLES THAT DECIDE EVERY HARD CASE
# ---------------------------------------------------------------------------
#   1. SUBJECT. R11 protects the PERSON, not their employer. A commercial event that
#      happens to a COMPANY -- a funding round, an acquisition, a trademark settlement,
#      an office opening, a patent grant -- is a business fact. A filter that kills it
#      because it contains a money word, or the word "settled", destroys the product
#      while looking careful. Where the money, the court record, the house or the
#      politics is the person's OWN, it is excluded however professional the framing.
#      Compare keep-company-trademark-settlement (the company is the party -> keep) with
#      legal-confidential-arbitration-respondent (the person is the party -> exclude).
#   2. DISCLOSURE. Personal history is excluded when the person did not put it in public
#      themselves. A member's own published professional material is theirs to have said;
#      repeating it back is hospitality, not surveillance. Compare keep-own-burnout-essay
#      (their own newsletter -> keep) with health-colleague-told-reporter (a third party
#      on the record about the same kind of thing -> exclude).
#
#   Two settled corollaries: professional testimony on the public record (a council
#   hearing, an expert-witness appearance, an amicus brief) is a KEEP, while political
#   donations, party registration and PAC giving are an EXCLUDE; and a sentence whose
#   only content is an unexplained absence fails CLOSED with low_confidence, because the
#   system cannot tell a sabbatical from a medical leave and guessing the category would
#   invent the very thing R11 protects.
#
# Every person, company, street, city and product named below is invented.
# ============================================================================

cases:

  # =========================================================================
  # home_or_property — where the member lives, and the paper trail of it.
  # =========================================================================

  - id: home-street-address-directory
    text: "A neighborhood association directory lists them at 214 Marrowbone Lane in Coldbrook Heights."
    category: home_or_property
    expect: exclude
    reason: home_or_property
    rule_layer: deterministic
    rationale: "A house number attached to a named street is the bluntest home leak there is, and a regex layer can catch the address shape without any reading of intent."

  - id: home-deed-purchase-record
    text: "Deed records name them as the buyer of a four-bedroom house on Ashvale Terrace in Thornbury Flats."
    category: home_or_property
    expect: exclude
    reason: home_or_property
    rule_layer: deterministic
    rationale: "Property transfer records are named explicitly in the rule, and the surface markers deed and buyer settle it with no ambiguity about whose property it is."

  - id: home-mortgage-refinance
    text: "County filings show they refinanced the mortgage on their Port Ludwick residence in April."
    category: home_or_property
    expect: exclude
    reason: home_or_property
    rule_layer: deterministic
    rationale: "Mortgage is a listed property-record term and the possessive pronoun ties the loan to the member personally rather than to any business holding."

  - id: home-residence-described-in-profile
    text: "A profile in the Vellacott Review described the converted grain silo they live in and the acre of pasture behind it."
    category: home_or_property
    expect: exclude
    reason: home_or_property
    rule_layer: llm
    llm_returns: home_or_property
    rationale: "No address or records vocabulary appears, so a keyword layer would pass it through, yet a description detailed enough to identify the dwelling is exactly what the home rule protects."

  - id: home-address-of-unknown-kind
    text: "A business directory lists a Thornbury Flats street address for them without saying whether it is a home or a registered office."
    category: home_or_property
    expect: exclude
    reason: home_or_property
    rule_layer: deterministic
    rationale: "This is NOT the unexplained-absence shape: the address itself is published and concrete, and only the building's USE is unknown. R11 forbids 'home/property addresses' for a person, so a street address printed against their name is a property fact whichever door it opens, and low_confidence would be the weaker of the two withholdings because a classifier can reopen it."

  # =========================================================================
  # family — spouses, children, relatives, personal relationships.
  # =========================================================================

  - id: family-daughter-school
    text: "Their daughter started sixth grade at a private school in New Alcona this fall."
    category: family
    expect: exclude
    reason: family
    rule_layer: deterministic
    rationale: "A named relationship term plus a child's school is a double leak, and daughter is an unambiguous surface marker that needs no classifier to catch."

  - id: family-spouse-gala-host
    text: "Their spouse, an anesthesiologist in Grantsmere, was listed among the hosts of the club's autumn gala."
    category: family
    expect: exclude
    reason: family
    rule_layer: deterministic
    rationale: "The professional detail belongs to the spouse rather than the member, so the whole sentence is a relative's fact and the word spouse fires the rule outright."

  - id: family-marriage-announcement
    text: "A local paper's announcements page records that they married an architect from Port Ludwick in June."
    category: family
    expect: exclude
    reason: family
    rule_layer: deterministic
    rationale: "Marriage is a personal relationship regardless of the announcement being public, and the verb married is a reliable deterministic trigger."

  - id: family-brother-made-introduction
    text: "A magazine feature traced how their brother introduced them to the investor who later led Halcyon Loom's seed round."
    category: family
    expect: exclude
    reason: family
    rule_layer: deterministic
    rationale: "The possessive relative term 'their brother' is the marker; the funding framing around it changes nothing, because a named sibling is a family fact wherever in the sentence it sits."

  # =========================================================================
  # health — diagnoses, treatment, medical history, addiction and recovery.
  # =========================================================================

  - id: health-diagnosis-in-benefits-appeal
    text: "A disability-benefits appeal states that they were diagnosed with multiple sclerosis in 2018."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    rationale: "Diagnosed with is the canonical medical marker and the record was produced by an agency, not by the member, so nothing about it is theirs to have said."

  - id: health-inpatient-treatment-letter
    text: "An insurer letter obtained by a reporter shows they spent three weeks in inpatient treatment for alcohol dependence."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    rationale: "Treatment and dependence are explicit addiction-and-recovery vocabulary, and a leaked insurer document is the opposite of self-disclosure on every axis."

  - id: health-colleague-told-reporter
    text: "A former colleague told a reporter at Broadsheet Nine that they had been treated for depression during the Loomstitch launch."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    rationale: "This is the disclosure line drawn the wrong way: a third party put the member's medical history into public, so the same topic they could have owned themselves becomes an exclusion."

  - id: health-ran-releases-from-hospital
    text: "Teammates recounted on a trade podcast that they ran the last two releases from a hospital bed while recovering from surgery."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    rationale: "The marker is the word 'surgery'; the work-ethic framing does not soften it, and teammates on a podcast are the disclosure principle's exclude side rather than the member's own account."

  - id: health-unexplained-eight-month-absence
    text: "They stepped back from all public work for eight months in 2023 and no public source says why."
    category: unresolved
    expect: exclude
    reason: low_confidence
    rule_layer: llm
    llm_returns: unsure
    fail_closed: true
    rationale: "Nothing in the sentence distinguishes a sabbatical from a medical leave, and picking a category would fabricate the very medical claim the rule exists to keep off the floor."

  # =========================================================================
  # legal — the member's own litigation, record, divorce and court files.
  # =========================================================================

  - id: legal-misdemeanor-guilty-plea
    text: "Court records show they pleaded guilty to a misdemeanor reckless-driving charge in Vellacott County in 2016."
    category: legal
    expect: exclude
    reason: legal
    rule_layer: deterministic
    rationale: "Pleaded guilty is a criminal-record marker naming the member as the defendant, which is the clearest possible case for the deterministic layer."

  - id: legal-divorce-petition
    text: "A divorce petition filed in Grantsmere district court names them as the petitioner."
    category: legal
    expect: exclude
    reason: legal
    rule_layer: deterministic
    rationale: "Divorce filings sit under the legal category by the rule's own wording, and both divorce and petitioner are unambiguous court-record terms."

  - id: legal-confidential-arbitration-respondent
    text: "They were a named respondent in a confidential arbitration brought by a former distributor."
    category: legal
    expect: exclude
    reason: legal
    rule_layer: llm
    llm_returns: legal
    rationale: "The commercial framing tempts a keep, but the member personally is the respondent, so the subject test makes this the member's own legal exposure rather than a company event."

  - id: legal-suit-against-former-cofounder
    text: "A feature in the Alcona Ledger walks through the four years they spent suing their former co-founder over the Tideglass trademark."
    category: legal
    expect: exclude
    reason: legal
    rule_layer: llm
    llm_returns: legal
    rationale: "A trademark fight reads as business until you notice the member is the plaintiff in their own name, which flips it to the member's own litigation."

  - id: legal-sealed-docket-unclear-role
    text: "A sealed docket carries both their name and their employer's in the caption, and no filing says in what capacity either party appears."
    category: unresolved
    expect: exclude
    reason: low_confidence
    rule_layer: llm
    llm_returns: unsure
    fail_closed: true
    rationale: "The subject test cannot be applied when the record itself will not say whether the member or the company is the party, so the safe reading is to withhold it."

  # =========================================================================
  # wealth — the member's own net worth, pay, stake and personal proceeds.
  # =========================================================================

  - id: wealth-leaked-salary-band
    text: "A leaked compensation band puts their base salary at $410,000 before bonus."
    category: wealth
    expect: exclude
    reason: wealth
    rule_layer: deterministic
    rationale: "Salary attached to a possessive pronoun is a listed wealth term and needs no interpretation to recognise as the member's personal compensation."

  - id: wealth-net-worth-estimate
    text: "A wealth-tracking site estimates their personal net worth at roughly $28 million."
    category: wealth
    expect: exclude
    reason: wealth
    rule_layer: deterministic
    rationale: "Net worth is the category's namesake phrase and the word personal removes any chance the figure describes a business rather than the member."

  - id: wealth-personal-acquisition-proceeds
    text: "They personally cleared an eight-figure sum when Norwood Anvil was acquired by Petrichor Systems."
    category: wealth
    expect: exclude
    reason: wealth
    rule_layer: deterministic
    rationale: "The marker is 'personally cleared': the adverb is what moves the money from the company's balance sheet to the member's pocket, which is why the acquisition beside it stays a keep."

  - id: wealth-remaining-equity-stake
    text: "A cap-table analysis in Terrace Quarterly puts their remaining stake in Kestrelwork at just under nine percent."
    category: wealth
    expect: exclude
    reason: wealth
    rule_layer: deterministic
    rationale: "Cap-table language is finance-desk vocabulary rather than a wealth keyword, yet a personal ownership percentage is a direct statement of what the member is worth."

  - id: wealth-came-out-well-unclear
    text: "An industry newsletter said they came out well from the Norwood Anvil sale without saying whether they held any equity."
    category: unresolved
    expect: exclude
    reason: low_confidence
    rule_layer: llm
    llm_returns: unsure
    fail_closed: true
    rationale: "The sentence hints at a personal payout while explicitly disclaiming knowledge of one, so surfacing it would put a financial insinuation about the member into staff mouths."

  # =========================================================================
  # political — the member's donations, registration and campaign giving.
  # =========================================================================

  - id: political-fec-contributions
    text: "FEC filings record eleven contributions from them to a congressional campaign committee between 2019 and 2022."
    category: political
    expect: exclude
    reason: political
    rule_layer: deterministic
    rationale: "Campaign contributions are excluded by the settled ruling even though they are public records, and contributions plus FEC is a clean keyword hit."

  - id: political-party-registration
    text: "Vellacott County voter rolls list them as a registered Republican since 2004."
    category: political
    expect: exclude
    reason: political
    rule_layer: deterministic
    rationale: "Party affiliation is named directly in the rule, and a registered-plus-party-name pattern is one of the easiest deterministic markers to write."

  - id: political-state-pac-gift
    text: "State campaign-finance data shows a $5,000 contribution from them to a gubernatorial candidate's PAC."
    category: political
    expect: exclude
    reason: political
    rule_layer: deterministic
    rationale: "PAC giving is called out explicitly by the ruling, and the sentence names both the vehicle and the member as the source of the money."

  - id: political-fundraiser-host-committee
    text: "Their name appears on the host committee for a mayoral fundraiser in Port Ludwick."
    category: political
    expect: exclude
    reason: political
    rule_layer: llm
    llm_returns: political
    rationale: "No donation verb or dollar figure appears, so only a classifier reading the framing will see that hosting a candidate's fundraiser is campaign support by another name."

  - id: political-checks-to-both-parties
    text: "A profile quotes them explaining why they write checks to both parties' senate committees, calling it buying two doors."
    category: political
    expect: exclude
    reason: political
    rule_layer: llm
    llm_returns: political
    rationale: "Being bipartisan about it does not make giving neutral, and the euphemism means a keyword layer would miss what is plainly described campaign giving."

  # =========================================================================
  # keep — ordinary professional facts the digest exists to surface.
  # Includes the two-principle hard keeps: company-owned money and legal
  # events, and sensitive topics the member published about themselves.
  # =========================================================================

  - id: keep-series-b-raise
    text: "Their company, Halcyon Loom, raised a $34 million Series B led by Marram Ventures in March."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A funding round is money that belongs to the company, not the member, so the subject test keeps it despite the large figure a naive wealth filter would flag."

  - id: keep-childrens-hospital-foundation-board
    text: "They sit on the board of the Coldbrook Children's Hospital Foundation."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Both children and hospital are decoys: this is a public board affiliation, saying nothing about the member's own family or their own health."

  - id: keep-sxsw-keynote
    text: "They are keynoting the design and hardware track at SXSW this spring."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A festival stage can read as leisure or personal travel, but a keynote is professional speaking work and precisely the kind of hook the digest is built to give staff."

  - id: keep-company-trademark-settlement
    text: "Kestrelwork settled a trademark dispute with a European retailer without admitting liability."
    category: keep
    expect: keep
    reason: null
    rule_layer: llm
    llm_returns: keep
    rationale: "Settled and liability are legal vocabulary, but the party is the company, so under the subject test this is a commercial event rather than the member's court record."

  - id: keep-acquisition-headline
    text: "Brindlefish Labs was acquired by Foxglove Optics for $40 million in October."
    category: keep
    expect: keep
    reason: null
    rule_layer: llm
    llm_returns: keep
    rationale: "The price is the company's, and nothing here says what the member took home, so it stays a business milestone rather than a statement of personal wealth."

  - id: keep-own-burnout-essay
    text: "On their own newsletter they published an essay about burning out in 2021 and what it changed about how they hire."
    category: keep
    expect: keep
    reason: null
    rule_layer: llm
    llm_returns: keep
    rationale: "The member put this in public themselves as professional reflection, and under the disclosure principle their own published material is theirs to have said."

  - id: keep-city-council-testimony
    text: "They testified before the Port Ludwick city council on warehouse noise limits on behalf of the freight association."
    category: keep
    expect: keep
    reason: null
    rule_layer: llm
    llm_returns: keep
    rationale: "Testimony at a public hearing is professional advocacy on a policy question and is a settled keep, distinct from the member's own political giving."

  - id: keep-expert-witness-appearance
    text: "A trial transcript records them appearing as an expert witness on optical-sensor calibration in a dispute between two rivals."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A court transcript looks like a legal record, yet the member is a hired expert rather than a party, which makes this professional testimony and a settled keep."

  - id: keep-amicus-brief-coauthor
    text: "They co-authored an amicus brief on device interoperability filed with a federal appeals court."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Filing a friend-of-the-court brief is published subject-matter expertise, not litigation the member is caught up in, so the legal setting does not make it personal."

  - id: keep-patent-grant
    text: "A patent for a low-drift humidity sensor was granted to their employer with them named as an inventor."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A patent grant is a company asset and an inventor credit is a professional accomplishment, so neither the legal machinery nor the ownership makes it a protected fact."

  - id: keep-regional-office-opening
    text: "Their company opened a 40-person office in Grantsmere to serve regional freight customers."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A corporate office is property belonging to the employer and the sentence carries no residence marker, so the keyword layer finds nothing to fire on and passes it."

  - id: keep-conference-program-chair
    text: "They chair the program committee for StrangeGrid, a systems conference held each autumn in New Alcona."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Conference organising is plain professional service with no protected vocabulary anywhere in the sentence for a rule to catch."

  - id: keep-open-source-maintainer
    text: "They maintain Nightjar, an open-source CLI for replaying HTTP traces that passed 9,000 stars this year."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Public open-source work is exactly the sort of hook a digest exists to hand staff, and the only number present counts stars rather than money."

  - id: keep-new-role-at-employer
    text: "They joined Petrichor Systems as head of platform engineering in January after six years at Cobalt Wren."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A job change is public professional history with no compensation, no family and no records attached, so nothing in the deterministic layer objects."

  - id: keep-peer-reviewed-paper
    text: "They co-authored a peer-reviewed paper on drift-resistant sensor calibration in an instrumentation journal."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Published research is self-disclosed professional output by definition and carries none of the six categories' vocabulary."

  - id: keep-graduate-seminar-teaching
    text: "They teach a graduate seminar on distributed storage at Alcona Polytechnic each spring."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Teaching is a public professional affiliation and the university named is a workplace rather than anything about where the member lives."

  - id: keep-engineering-award
    text: "The Instrument Guild gave them its annual engineering award for work on fault-tolerant kiln controllers."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "An award citation is a recognition of professional work, and prize language carries no personal-finance meaning for the wealth rule to catch."

  - id: keep-standards-draft-editor
    text: "They serve as editor of a working-group draft on streaming telemetry formats at the internet standards body."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Standards work is public technical service, and the committee framing has no overlap with the member's political or legal life."

  - id: keep-graduate-degree
    text: "They earned a master's in materials science from Vellacott University before moving into industrial sensing."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Education is ordinary biography that the member's own bios routinely carry, and it touches none of the six protected categories."

  - id: keep-team-hiring-plan
    text: "Their team is hiring six embedded engineers this year to build out the Kilnwright controller line."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "Hiring plans are company operations and one of the most useful openers a host can offer, with no personal compensation figure in sight."

  - id: keep-robotics-collaboration
    text: "They are collaborating with a robotics group at Norwood Institute on grasp planning for warehouse arms."
    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    rationale: "A named professional collaboration is a keepable affiliation, and the relationship described is with an institution rather than a relative."

  # =========================================================================
  # REGRESSION COVERAGE
  # -------------------------------------------------------------------------
  # The fifty cases above are the independent judgment corpus. The cases below
  # were added afterwards, deliberately, to close a measured hole: deleting an
  # R11 marker from src/arrival/taste.py -- "marriage to", "restraining order",
  # "millionaire", "party affiliation" -- broke NOTHING, in this corpus or in
  # the frozen one. A category that can be quietly removed is a category that
  # can quietly stop protecting anybody. Each sentence below is an ordinary
  # ruling a reviewer can check on its own terms; what makes them a set is that
  # each one is the only case standing on a named marker.
  # =========================================================================

  - id: cover-health-in-hospital
    text: "A trade newsletter mentioned in passing that they were in hospital for a week over the winter."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    provenance: derived_from_implementation
    rationale: "A hospital stay reported by a newsletter is a medical fact disclosed by somebody else; nothing about greeting a member needs it."

  - id: cover-health-hospitalised
    text: "Local reporting said they were hospitalised after a cycling accident on the coast road."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    provenance: derived_from_implementation
    rationale: "An accident and its treatment are health, and a member who did not publish it did not choose to share it."

  - id: cover-health-prescription
    text: "An interview with a former assistant described the medication they take for chronic migraines."
    category: health
    expect: exclude
    reason: health
    rule_layer: deterministic
    provenance: derived_from_implementation
    rationale: "A prescription named by a third party is the clearest kind of medical disclosure the member never made."

  - id: cover-health-named-condition
