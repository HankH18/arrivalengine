    category: keep
    expect: keep
    reason: null
    rule_layer: deterministic
    provenance: same_author_as_filter
    rationale: "R11 protects a member's health information. The word cancer here names the company's market; the sentence says nothing whatever about the member's own health, and withholding it deletes the single most interesting thing a host could ask about."

