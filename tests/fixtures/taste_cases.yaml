  # =========================================================================
  # AXIS B — EXCLUDES THAT DO NOT NAME THEIR OWN CATEGORY (T-070/F6)
  # -------------------------------------------------------------------------
  # The mirror hole. Almost every exclude above announces itself: the divorce
  # case contains "divorce", the salary case contains "salary", the party case
  # contains "party". A corpus made only of those grades a dictionary. R11
  # names CATEGORIES, not words, and the sentences a real source produces
  # rarely use the category's own name.
  #
  # Each sentence below is an R11 fact whose category word is absent from it.
  # They were ALL kept by the filter when they were written -- displayed, on a
  # host-facing page -- and each is a leak that a lexical corpus cannot see.
  # =========================================================================

  - id: axis-legal-offender-registry
