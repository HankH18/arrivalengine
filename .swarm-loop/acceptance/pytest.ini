# FROZEN pytest configuration for every scored metric. Passed as `-c <this file>`.
#
# WHY THIS FILE EXISTS -- measured, not theorised:
# `--rootdir` does NOT stop pytest's configfile discovery. With only
# `-o addopts= --confcutdir --rootdir`, the frozen invocation still reported
# `configfile: ../../pyproject.toml` and honoured every ini key in it except addopts.
# A TWO-LINE worker-writable pyproject.toml:
#
#     [tool.pytest.ini_options]
#     python_files = ["test_t0_*.py"]
#
# took the frozen suite from 93 collected to 12, and --pass-rate from 15.05 to 100.0,
# without moving one frozen byte -- so `verify` stayed green, `check-branch` had
# nothing to veto (pyproject.toml is not a protected path) and no '*test*' diff glob
# could ever match it. `-c` is the only flag that overrides discovery outright.
# Re-probed with this file in place and a maximally hostile pyproject.toml
# (python_files/testpaths/norecursedirs all sabotaged): 93 collected, both times.
#
# Every discovery key the denominator depends on is pinned HERE, explicitly, rather
# than left to a default that a future pytest could change underneath the run.

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv __pycache__ .ruff_cache .pytest_cache node_modules fixtures
addopts =
